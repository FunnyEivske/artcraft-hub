<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="512" cy="512" r="340" fill="none" stroke="url(#glowGrad)" stroke-width="12" opacity="0.4" filter="url(#glow)" />

  <!-- Modern Geometric Creative Diamond / Hexagon Matrix -->
  <!-- Central Stylized Creative Hub Symbol -->
  <g filter="url(#glow)">
    <!-- Central Prism Node -->
    <path d="M 512 210 L 760 350 L 760 674 L 512 814 L 264 674 L 264 350 Z" 
          fill="none" 
          stroke="url(#brandGrad)" 
          stroke-width="36" 
          stroke-linejoin="round" />
    
    <!-- Inner Cross-App Nexus Vectors -->
    <line x1="512" y1="210" x2="512" y2="512" stroke="url(#brandGrad)" stroke-width="24" stroke-linecap="round" />
    <line x1="760" y1="350" x2="512" y2="512" stroke="url(#brandGrad)" stroke-width="24" stroke-linecap="round" />
    <line x1="760" y1="674" x2="512" y2="512" stroke="url(#brandGrad)" stroke-width="24" stroke-linecap="round" />
    <line x1="512" y1="814" x2="512" y2="512" stroke="url(#brandGrad)" stroke-width="24" stroke-linecap="round" />
    <line x1="264" y1="674" x2="512" y2="512" stroke="url(#brandGrad)" stroke-width="24" stroke-linecap="round" />
    <line x1="264" y1="350" x2="512" y2="512" stroke="url(#brandGrad)" stroke-width="24" stroke-linecap="round" />

    <!-- Core Orb -->
    <circle cx="512" cy="512" r="64" fill="url(#brandGrad)" />
    <circle cx="512" cy="512" r="28" fill="#ffffff" />
  </g>

  <!-- 6 Creative Domain Orbit Nodes -->
  <!-- Photo / Visual (Cyan) -->
  <circle cx="512" cy="210" r="32" fill="#38bdf8" stroke="#ffffff" stroke-width="8" />
  <!-- Vector / Design (Indigo) -->
  <circle cx="760" cy="350" r="32" fill="#6366f1" stroke="#ffffff" stroke-width="8" />
  <!-- Video / Film (Pink) -->
  <circle cx="760" cy="674" r="32" fill="#ec4899" stroke="#ffffff" stroke-width="8" />
  <!-- Audio / Sound (Amber) -->
  <circle cx="512" cy="814" r="32" fill="#f59e0b" stroke="#ffffff" stroke-width="8" />
  <!-- UI / FigCraft (Emerald) -->
  <circle cx="264" cy="674" r="32" fill="#10b981" stroke="#ffffff" stroke-width="8" />
  <!-- Document / PDF (Purple) -->
  <circle cx="264" cy="350" r="32" fill="#a855f7" stroke="#ffffff" stroke-width="8" />
</svg>

[package]
name = "openart-hub"
version = "1.0.2"
description = "OpenArt Hub - Complete Creative Suite Desktop Hub"
authors = ["OpenArt Creative Team"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
zip = "2.2"
dirs = "5.0"
futures-util = "0.3"
base64 = "0.22"
notify = "6.1"
